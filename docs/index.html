/* =========================================================
   Incline Financial — Design Tokens
   Uber-inspired: stark monochrome, pill-shaped UI, geometric type
   ========================================================= */

@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Cormorant+Garamond:wght@400;500;600&family=Instrument+Sans:wght@400;500;600&display=swap');

:root {
  /* ---------- Color: Primary ---------- */
  --incline-black: #000000;
  --incline-white: #ffffff;

  /* ---------- Color: Accent (deep gold) ---------- */
  --accent: #b8893a;
  --accent-deep: #8d6724;
  --accent-soft: #e8d6a8;
  --accent-bg: #f6efdc;

  /* ---------- Color: Interactive / Hover ---------- */
  --hover-gray: #e2e2e2;
  --hover-light: #f3f3f3;
  --chip-gray: #efefef;

  /* ---------- Color: Text ---------- */
  --body-gray: #4b4b4b;
  --muted-gray: #afafaf;

  /* ---------- Color: Borders ---------- */
  --border-black: #000000;
  --border-subtle: #e2e2e2;

  /* ---------- Color: Shadows ---------- */
  --shadow-light: rgba(0, 0, 0, 0.12);
  --shadow-medium: rgba(0, 0, 0, 0.16);
  --shadow-press: rgba(0, 0, 0, 0.08);

  /* ---------- Color: Links ---------- */
  --link-blue: #0000ee;
  --link-white: #ffffff;
  --link-black: #000000;

  /* ---------- Semantic foreground/background ---------- */
  --fg-1: #000000;          /* Primary text */
  --fg-2: #4b4b4b;          /* Secondary text */
  --fg-3: #afafaf;          /* Tertiary / muted */
  --fg-inverse: #ffffff;    /* On dark surfaces */

  --bg-1: #ffffff;          /* Page surface */
  --bg-2: #f3f3f3;          /* Subtle surface */
  --bg-3: #efefef;          /* Chip surface */
  --bg-inverse: #000000;    /* Footer, hero on black */

  /* ---------- Typography: Families ---------- */
  /* NOTE: UberMove is proprietary. Inter is used as the closest
     geometric sans-serif substitute available on Google Fonts. */
  --font-display: 'Inter', system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-body: 'Inter', system-ui, 'Helvetica Neue', Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace;

  /* ---------- Typography: Sizes ---------- */
  --fs-display: 52px;       /* Hero billboard */
  --fs-h1: 36px;            /* Section heading */
  --fs-h2: 32px;            /* Card title */
  --fs-h3: 24px;            /* Sub-heading */
  --fs-h4: 20px;            /* Small heading */
  --fs-nav: 18px;           /* Nav / UI Large */
  --fs-body: 16px;          /* Body / button */
  --fs-caption: 14px;       /* Caption */
  --fs-micro: 12px;         /* Fine print */

  /* ---------- Typography: Line heights ---------- */
  --lh-display: 1.23;
  --lh-h1: 1.22;
  --lh-h2: 1.25;
  --lh-h3: 1.33;
  --lh-h4: 1.40;
  --lh-body: 1.50;
  --lh-tight: 1.25;
  --lh-relaxed: 1.67;

  /* ---------- Typography: Weights ---------- */
  --fw-regular: 400;
  --fw-medium: 500;
  --fw-bold: 700;

  /* ---------- Spacing (8px base) ---------- */
  --space-1: 4px;
  --space-2: 6px;
  --space-3: 8px;
  --space-4: 10px;
  --space-5: 12px;
  --space-6: 14px;
  --space-7: 16px;
  --space-8: 18px;
  --space-9: 20px;
  --space-10: 24px;
  --space-11: 32px;
  --space-12: 48px;
  --space-13: 64px;
  --space-14: 96px;

  /* ---------- Radii ---------- */
  --radius-sharp: 0px;
  --radius-card: 8px;
  --radius-card-lg: 12px;
  --radius-pill: 999px;
  --radius-circle: 50%;

  /* ---------- Shadows / Elevation ---------- */
  --elev-0: none;
  --elev-1: 0 4px 16px rgba(0, 0, 0, 0.12);
  --elev-2: 0 4px 16px rgba(0, 0, 0, 0.16);
  --elev-3: 0 2px 8px rgba(0, 0, 0, 0.16);
  --elev-press: inset 0 0 0 999px rgba(0, 0, 0, 0.08);
  --focus-ring: inset 0 0 0 2px rgb(255, 255, 255);

  /* ---------- Layout ---------- */
  --container-max: 1136px;
  --nav-height: 64px;

  /* ---------- Motion ---------- */
  --ease-standard: cubic-bezier(0.4, 0, 0.2, 1);
  --duration-fast: 120ms;
  --duration-base: 200ms;
  --duration-slow: 300ms;
}

/* =========================================================
   Base typography reset
   ========================================================= */
html, body {
  font-family: var(--font-body);
  color: var(--fg-1);
  background: var(--bg-1);
  font-size: var(--fs-body);
  line-height: var(--lh-body);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* =========================================================
   Semantic type roles
   ========================================================= */
.t-display {
  font-family: var(--font-display);
  font-size: var(--fs-display);
  font-weight: var(--fw-bold);
  line-height: var(--lh-display);
  letter-spacing: -0.02em;
  color: var(--fg-1);
}

.t-h1 {
  font-family: var(--font-display);
  font-size: var(--fs-h1);
  font-weight: var(--fw-bold);
  line-height: var(--lh-h1);
  letter-spacing: -0.01em;
  color: var(--fg-1);
}

.t-h2 {
  font-family: var(--font-display);
  font-size: var(--fs-h2);
  font-weight: var(--fw-bold);
  line-height: var(--lh-h2);
  letter-spacing: -0.01em;
  color: var(--fg-1);
}

.t-h3 {
  font-family: var(--font-display);
  font-size: var(--fs-h3);
  font-weight: var(--fw-bold);
  line-height: var(--lh-h3);
  color: var(--fg-1);
}

.t-h4 {
  font-family: var(--font-display);
  font-size: var(--fs-h4);
  font-weight: var(--fw-bold);
  line-height: var(--lh-h4);
  color: var(--fg-1);
}

.t-nav {
  font-family: var(--font-body);
  font-size: var(--fs-nav);
  font-weight: var(--fw-medium);
  line-height: var(--lh-h3);
  color: var(--fg-1);
}

.t-body {
  font-family: var(--font-body);
  font-size: var(--fs-body);
  font-weight: var(--fw-regular);
  line-height: var(--lh-body);
  color: var(--fg-1);
}

.t-body-medium {
  font-family: var(--font-body);
  font-size: var(--fs-body);
  font-weight: var(--fw-medium);
  line-height: var(--lh-tight);
  color: var(--fg-1);
}

.t-caption {
  font-family: var(--font-body);
  font-size: var(--fs-caption);
  font-weight: var(--fw-regular);
  line-height: 1.43;
  color: var(--fg-2);
}

.t-micro {
  font-family: var(--font-body);
  font-size: var(--fs-micro);
  font-weight: var(--fw-regular);
  line-height: var(--lh-relaxed);
  color: var(--fg-2);
}

/* =========================================================
   Reusable pill button base
   ========================================================= */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  border: none;
  border-radius: var(--radius-pill);
  font-family: var(--font-body);
  font-size: var(--fs-body);
  font-weight: var(--fw-medium);
  line-height: 1;
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard),
              color var(--duration-fast) var(--ease-standard),
              box-shadow var(--duration-fast) var(--ease-standard);
  white-space: nowrap;
  text-decoration: none;
}

.btn-primary {
  background: var(--incline-black);
  color: var(--incline-white);
  padding: 14px 20px;
}
.btn-primary:hover { background: #1a1a1a; }
.btn-primary:active { box-shadow: var(--elev-press); }

.btn-secondary {
  background: var(--incline-white);
  color: var(--incline-black);
  padding: 14px 20px;
  box-shadow: inset 0 0 0 1px var(--incline-black);
}
.btn-secondary:hover { background: var(--hover-gray); }

.btn-chip {
  background: var(--chip-gray);
  color: var(--incline-black);
  padding: 14px 16px;
  font-size: var(--fs-caption);
}
.btn-chip:hover { background: var(--hover-gray); }
.btn-chip[aria-pressed="true"],
.btn-chip.is-active {
  background: var(--incline-black);
  color: var(--incline-white);
}

/* =========================================================
   Incline Financial — Site styles (full spec rebuild)
   ========================================================= */

* { box-sizing: border-box; }

  line-height: 1.5;

}
a { color: inherit; }
button { font: inherit; }
h1, h2, h3, h4, p { margin: 0; }

.container { max-width: 1136px; margin: 0 auto; padding: 0 32px; }

/* =========================================================
   Topbar (above sticky nav)

.topbar-inner {

}
.topbar-phone:hover { color: rgba(255,255,255,0.85); }
@media (max-width: 720px) {
  .topbar-tag { display: none; }
  .topbar-inner { justify-content: center; }
}

/* =========================================================
   Page shell + sticky nav
   ========================================================= */
.page-shell {
  max-width: 1280px;
  margin: 0 auto;
  background: #f5f5f5;
}

.nav-sticky {
  position: sticky;
  top: 0;
  z-index: 50;
  background: #f5f5f5;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 18px 32px;
  gap: 24px;

  transition: border-color 200ms ease, background 200ms ease, box-shadow 200ms ease;
}
.nav-sticky.scrolled {
  background: rgba(245,245,245,0.92);

.nav-brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: #000; font-weight: 700; font-size: 19px; letter-spacing: -0.02em; }
.nav-brand .brand-mark { width: 32px; height: 32px; background: #000; border-radius: 8px; display: flex; align-items: center; justify-content: center; }

.nav-links { display: flex; gap: 4px; }

.nav-actions { display: flex; align-items: center; gap: 8px; }

  .nav-links { display: none; }

}

   Mobile sticky bar
   ========================================================= */
.mobile-sticky {
  display: none;

  bottom: 0; left: 0; right: 0;
  z-index: 60;
  background: #fff;

}

  .mobile-sticky { display: flex; }

/* =========================================================
   Buttons
   ========================================================= */
.btn {
  display: inline-flex;

.cm-meta { font-size: 13px; color: #4b4b4b; margin-top: 4px; }

.expect-panel {
  background: #000;
  color: #fff;
  border-radius: 20px;
  padding: 32px;
  position: relative;
  overflow: hidden;
}
.expect-panel::before {
  content: "";
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(to right, rgba(255,255,255,0.04) 1px, transparent 1px),
    linear-gradient(to bottom, rgba(255,255,255,0.04) 1px, transparent 1px);
  background-size: 32px 32px;
  pointer-events: none;
}
.expect-panel > * { position: relative; z-index: 1; }
.expect-eyebrow {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: -0.005em;
  margin-bottom: 22px;
  padding-bottom: 18px;
  border-bottom: 1px solid rgba(255,255,255,0.16);
}
.expect-list {
  display: flex;
  flex-direction: column;
  gap: 18px;
}
.expect-list li {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  font-size: 14px;
  line-height: 1.55;
  color: rgba(255,255,255,0.85);
}
.expect-list li strong { color: #fff; font-weight: 700; }
.expect-num {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  color: rgba(255,255,255,0.5);
  flex-shrink: 0;
  padding-top: 2px;
  width: 24px;
}

.form-card {
  background: #fff;
  border-radius: 20px;
  padding: 36px;
  box-shadow: 0 4px 16px rgba(0,0,0,0.04);
}
.form-heading {
  font-size: 26px;
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.18;
  margin-bottom: 8px;
}
.form-sub {
  font-size: 14px;
  color: #4b4b4b;
  margin-bottom: 28px;
}
.form {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.form .full { grid-column: span 2; }
.field label {
  display: block;
  font-size: 12px;
  font-weight: 600;
  color: #4b4b4b;
  margin-bottom: 8px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.field input,
.field select,
.field textarea {
  width: 100%;
  box-sizing: border-box;
  border: 1px solid #d4d4d4;
  background: #fff;
  border-radius: 12px;
  padding: 14px 16px;
  font-family: inherit;
  font-size: 15px;
  color: #000;
  outline: none;
  transition: border-color 150ms ease, box-shadow 150ms ease;
}
.field input:focus,
.field select:focus,
.field textarea:focus {
  border-color: #000;
  box-shadow: 0 0 0 3px rgba(0,0,0,0.06);
}
.field textarea { resize: vertical; min-height: 120px; }
.field .err { font-size: 12px; color: #000; margin-top: 6px; font-weight: 600; }
.field.error input,
.field.error select,
.field.error textarea {
  border-color: #000;
  box-shadow: 0 0 0 2px #000 inset;
}
.form-submit {
  width: 100%;
  padding: 18px 24px;
  font-size: 15px;
  font-weight: 600;
  margin-top: 8px;
}
.form-divider {
  margin: 28px 0 18px;
  text-align: center;
  position: relative;
  font-size: 12px;
  color: #afafaf;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.form-divider::before,
.form-divider::after {
  content: "";
  position: absolute;
  top: 50%;
  width: calc(50% - 60px);
  height: 1px;
  background: #e2e2e2;
}
.form-divider::before { left: 0; }
.form-divider::after { right: 0; }
.form-call {
  display: flex;
  align-items: center;
  gap: 12px;
  background: #f3f3f3;
  border-radius: 12px;
  padding: 16px 20px;
  text-decoration: none;
  color: #000;
  font-size: 14px;

}
.form-call:hover { background: #e2e2e2; }
.form-call strong { font-weight: 700; }
.form-foot {
  margin-top: 18px;
  font-size: 12px;
  color: #afafaf;
  text-align: center;
  letter-spacing: 0.02em;
}

/* =========================================================
   ACCENT OVERRIDE — deep gold (#b8893a)
   Applied to: primary CTAs, active nav, bullet dots,
   key highlights, hover states, key icons.
   Everything else stays monochrome.
   ========================================================= */

/* --- Primary buttons --- */
.btn-primary { background: var(--accent); color: #fff; }
.btn-primary:hover { background: var(--accent-deep); }
.form-submit:hover { background: var(--accent-deep) !important; }

/* --- Nav: active state + hover --- */
.nav-link.active { color: var(--accent-deep); font-weight: 600; }
.nav-link.active::after {
  content: ""; display: block;
  width: 18px; height: 2px;
  background: var(--accent);
  border-radius: 2px;
  margin: 2px auto 0;
}
.nav-link:hover { color: var(--accent-deep); }
.nav-phone:hover { color: var(--accent-deep); }

/* --- Eyebrow bullet dots: GOLD --- */
.eyebrow.dot::before { background: var(--accent) !important; }

/* --- Hero: emphasised line --- */
.hb-title-emph { color: var(--accent-deep); }

/* --- Numerical step markers --- */
.wwd-num,
.value-num,
.how-num,
.principle-num,
.every-num,
.expect-num,
.tier-eyebrow {
  color: var(--accent-deep) !important;
}

/* Tier featured card style is consolidated in the main .tier-card block above */

/* --- Inline check icons in lists --- */
.proof-item svg,
.tier-list li svg,
.expect-list strong + *,
.success-check {
  color: var(--accent-deep);
}
.tier-list li svg { color: var(--accent-deep); }

/* --- Service tier-detail circular check pill --- */
.td-check { background: var(--accent); color: #fff; }
.tier-detail.tier-dark .td-check { background: var(--accent); color: #fff; }

/* --- vs-table Incline column header --- */
.vs-col-incline { color: var(--accent-deep); }
.vs-mark { background: var(--accent) !important; }
.vs-row .vs-inc { color: #1a1a1a; }
.vs-row .vs-inc::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  background: var(--accent);
  border-radius: 50%;
  margin-right: 10px;
  vertical-align: middle;
  transform: translateY(-2px);
}

/* --- Testimonial stars --- */
.test-stars { color: var(--accent); }

/* --- Links / hover affordances --- */
.moc-link:hover,
.adv-cta:hover,
a:hover .accent-on-hover { color: var(--accent-deep); }

/* --- Success state: accent check circle --- */
.success-check {
  background: var(--accent) !important;
  color: #fff !important;
}

/* --- FAQ open row: gold accent on number --- */
.faq-row.open .faq-num { color: var(--accent-deep); font-weight: 700; }
.faq-row.open .faq-q { color: var(--accent-deep); }

/* --- Topbar phone number --- */
.topbar-phone { color: var(--accent-soft); }
.topbar-phone:hover { color: var(--accent); }

/* --- Final CTA accent eyebrow --- */
.fc-eyebrow { color: var(--accent) !important; }
.fc-eyebrow::before {
  content: "";
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent);

}

/* --- Mobile sticky bar primary action --- */
.ms-book { background: var(--accent) !important; }
.ms-book:hover { background: var(--accent-deep) !important; }

/* --- "Best for" panel in tier detail --- */
.td-best { border-left: 2px solid var(--accent) !important; }
.td-best-label { color: var(--accent-deep) !important; }

/* --- Form focus rings --- */

/* =========================================================
   Animations: scroll-triggered fade-ins, staggered grids,
   card hover lifts, button transitions, hero mock slide-in
   ========================================================= */
@media (prefers-reduced-motion: no-preference) {
  /* Section fade-up — every section except the home hero */
  .anim section:not(.hero-big) {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 400ms ease-out, transform 400ms ease-out;
    will-change: opacity, transform;
  }
  .anim section.in { opacity: 1; transform: translateY(0); }

  /* Staggered grid children */
  .anim .wwd-grid > *,
  .anim .who-grid > *,
  .anim .tiers-grid > *,
  .anim .test-grid > *,
  .anim .values-grid > *,
  .anim .how-list > *,
  .anim .every-grid > *,
  .anim .vs-table > .vs-row:not(.vs-row-head) {
    opacity: 0;
    transform: translateY(16px);
    transition: opacity 400ms ease-out, transform 400ms ease-out;
    transition-delay: calc(var(--stagger-i, 0) * 100ms);
    will-change: opacity, transform;
  }
  .anim .wwd-grid.in > *,
  .anim .who-grid.in > *,
  .anim .tiers-grid.in > *,
  .anim .test-grid.in > *,
  .anim .values-grid.in > *,
  .anim .how-list.in > *,
  .anim .every-grid.in > *,
  .anim .vs-table.in > .vs-row:not(.vs-row-head) {
    opacity: 1;
    transform: translateY(0);
  }

  /* Card hover lift */
  .wwd-card, .who-card, .test-card,
  .value-card, .how-row, .every-card {
    transition: transform 200ms ease, box-shadow 200ms ease;
  }
  .wwd-card:hover, .who-card:hover, .test-card:hover,
  .value-card:hover, .how-row:hover, .every-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 28px rgba(0,0,0,0.10);
  }
  /* Tier cards: gold border + soft shadow + lift on hover (no bg change) */
  .tier-card:hover {
    border-color: rgba(184,137,58,0.5);
    border-width: 1.5px;
    transform: translateY(-6px);
    box-shadow: 0 16px 40px rgba(0,0,0,0.10);
  }

  /* Button colour transitions */
  .btn { transition: background-color 180ms ease, color 180ms ease, border-color 180ms ease, box-shadow 180ms ease; }

  /* Hero mock dashboards slide in from right on home-page mount */
  .anim .hb-mocks {
    opacity: 0;
    transform: translateX(40px);
    transition: opacity 600ms ease-out, transform 600ms ease-out;
    will-change: opacity, transform;
  }
  .anim .hb-mocks.in { opacity: 1; transform: translateX(0); }

  /* Counter targets render with stable widths during animation */
  [data-counter-target] { font-variant-numeric: tabular-nums; }
}

   CTA BUTTONS — unified dark-filled style
   Applied to every booking CTA: nav, hero, tier cards,
   final CTA sections, mobile sticky bar, and the contact
   form submit. Phone links and secondary buttons unchanged.

.btn-on-dark,
.ms-book {

  color: #ffffff !important;
  border: none;
  font-family: var(--font-body);
  font-weight: 500 !important;
  transition: background-color 180ms ease, color 180ms ease, box-shadow 180ms ease;

.btn-on-dark:hover,
.ms-book:hover,
.form-submit:hover {
  background: #1a2540 !important;
}

/* =========================================================
   BOTTOM CTA — match landing.html exactly
   Eyebrow gets gold accent + gold dot pseudo; the booking
   CTA inside the card reverts to white-on-dark for contrast
   against the inner #000 card.
   ========================================================= */
.fc-eyebrow {
  color: var(--accent);
}
.fc-eyebrow::before {
  content: "";
  display: inline-block;
  width: 6px;
  height: 6px;
  border-radius: 50%;
  background: var(--accent);
  margin-right: 8px;
  vertical-align: middle;
}

.final-cta .btn-on-dark {
  background: #ffffff !important;
  color: #000000 !important;
  border: none !important;
}
.final-cta .btn-on-dark:hover {
  background: #e2e2e2 !important;
  color: #000000 !important;
}

/* =========================================================
   Closing-CTA — robustness pass
   The decorative glow (::after) must never sit above the
   button or contact links, even mid-animation. And the CTA
   content must be fully visible and clickable from the very
   first paint, so an incomplete or paused scroll-fade never
   leaves the CTA hidden.
   ========================================================= */
.final-cta { isolation: isolate; }
.final-cta::before,
.final-cta::after { z-index: 0; }
.final-cta > * { position: relative; z-index: 2; }
.final-cta .fc-actions,
.final-cta .fc-contact-links { z-index: 3; }

/* The closing-CTA section opts out of the section-level fade-up:
   its content is guaranteed visible from the first paint, whether
   the IntersectionObserver fires or not. */
.anim section.final-cta-section {
  opacity: 1 !important;
  transform: none !important;
}

/* The decorative glow keeps its "animates into place" feel — but
   only for users without reduced-motion, and it lives beneath the
   button in the stacking order, so it can never obscure it. */
@media (prefers-reduced-motion: no-preference) {
  .final-cta::after {
    opacity: 0;
    transform: translate(-50%, 32px);
    transition:
      opacity 700ms ease-out 120ms,
      transform 800ms ease-out 120ms;
  }
  .anim section.final-cta-section.in .final-cta::after {
    opacity: 1;
    transform: translate(-50%, 0);
  }
}

/* =========================================================
   Service tier comparison table (WhatWeDo · StageOperations)
   4-column table with gold accents, emphasised "Managed" column
   (most popular), stronger price row. Scrolls horizontally on
   narrow viewports.
   ========================================================= */
.svc-table-wrap {
  width: 100%;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  border-radius: 16px;
  background: #fff;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.06);
}
.svc-table {
  width: 100%;
  min-width: 560px;
  border-collapse: collapse;
  font-size: 14px;
  color: #000;
}
.svc-table th,
.svc-table td {
  padding: 18px 20px;
  text-align: center;
  vertical-align: middle;
  border-bottom: 1px solid rgba(0,0,0,0.08);
}
.svc-table thead th {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #4b4b4b;
  padding-top: 22px;
  padding-bottom: 22px;
  background: #fafafa;
  border-bottom: 1px solid rgba(0,0,0,0.12);
}
.svc-table th.svc-feature,
.svc-table td.svc-feature {
  text-align: left;
  font-weight: 500;
  color: #1a1a1a;
  min-width: 240px;
}
.svc-table .svc-check {
  color: var(--accent);
  display: inline-flex;
  align-items: center;
  justify-content: center;
}
.svc-table .svc-dash {
  color: rgba(0,0,0,0.28);
  display: inline-block;
  font-size: 16px;
}
.svc-table tr:last-child td { border-bottom: none; }
.svc-table tr.svc-price-row td {
  font-weight: 700;
  font-size: 16px;
  padding-top: 22px;
  padding-bottom: 22px;
  border-top: 2px solid rgba(0,0,0,0.18);
  background: #fafafa;
}
.svc-table tr.svc-price-row td:not(.svc-feature) {
  color: var(--accent);
  letter-spacing: -0.01em;
  font-size: 18px;
  font-weight: 800;
}

/* Header cell stack: tag (Most popular) → tier name → sub descriptor.
   Reserved slots keep tier names and any tags visually anchored at the
   top of every column, so "Managed / Most popular" sits together at the
   top of its column and lines up with Core and Full Function. */
.svc-table thead th { vertical-align: top; }
.svc-th-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.svc-th-tag-slot {
  min-height: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.svc-th-name {
  /* inherits th typography: 11px uppercase, gold on Managed */
}
.svc-th-sub-slot {
  min-height: 34px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
.svc-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  color: var(--accent-deep);
  text-transform: uppercase;
  line-height: 1.2;
}
.svc-th-sub {
  display: inline-block;
  max-width: 200px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0;
  text-transform: none;
  color: #6b6b6b;
  line-height: 1.4;
}

/* Price cell stack: £ figure → optional scoping note. Slot reserves
   space so all three £ figures sit on the same horizontal line. */
.svc-price-stack {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
}
.svc-price-fig {
  font-size: 18px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.01em;
}
.svc-price-note-slot {
  min-height: 42px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}
.svc-table tr.svc-price-row td { vertical-align: top; }
.svc-price-note {
  display: inline-block;
  max-width: 220px;
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0;
  color: #6b6b6b;
  line-height: 1.4;
  text-transform: none;
}

/* "Managed" — the recommended middle tier — visually emphasised
   with a soft tint and a subtle gold outline down the column. */
.svc-table thead th:nth-child(3) {
  background: #f6efe1;
  color: var(--accent-deep);
  position: relative;
}
.svc-table tbody td:nth-child(3) {
  background: rgba(184,137,58,0.05);
  box-shadow:
    inset 1px 0 0 rgba(184,137,58,0.35),
    inset -1px 0 0 rgba(184,137,58,0.35);
}
.svc-table tr.svc-price-row td:nth-child(3) {
  background: #f6efe1;
}

/* =========================================================
   Mobile stacked tier cards — replaces the comparison table
   on narrow viewports so nothing forces horizontal page scroll.
   Each card is internally consistent; cards stack vertically
   with even spacing.
   ========================================================= */
.svc-tier-cards { display: none; }
.svc-card {
  background: #fff;
  border-radius: 16px;
  padding: 24px 22px;
  box-shadow: inset 0 0 0 1px rgba(0,0,0,0.08);
  display: flex;
  flex-direction: column;
}
.svc-card-featured {
  background: linear-gradient(180deg, #f6efe1 0%, #ffffff 55%);
  box-shadow: inset 0 0 0 1px rgba(184,137,58,0.45);
}
.svc-card-head {

  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.svc-card-title {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -0.02em;
  color: #1a1a1a;
  margin: 0;
}
.svc-card-featured .svc-card-title { color: var(--accent-deep); }
.svc-card-tag {
  display: inline-block;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--accent-deep);
  background: #f6efe1;
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap;
}
.svc-card-featured .svc-card-tag { background: #fff; }
.svc-card-sub-slot { min-height: 20px; margin-top: 6px; }
.svc-card-sub {
  font-size: 12px;
  color: #6b6b6b;
  line-height: 1.45;
  margin: 0;
}
.svc-card-list {
  list-style: none;
  padding: 0;
  margin: 18px 0 20px 0;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-top: 1px solid rgba(0,0,0,0.08);
  padding-top: 18px;
}
.svc-card-list li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14px;
  color: #1a1a1a;
  line-height: 1.45;
}
.svc-card-check {
  width: 18px;
  height: 18px;
  border-radius: 50%;
  background: var(--accent);
  color: #fff;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  margin-top: 2px;
}
.svc-card-price-row {
  display: flex;
  align-items: baseline;
  gap: 10px;
  border-top: 1px solid rgba(0,0,0,0.08);
  padding-top: 16px;
  margin-top: auto;
}
.svc-card-from {
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #4b4b4b;
}
.svc-card-price {
  font-size: 22px;
  font-weight: 800;
  color: var(--accent);
  letter-spacing: -0.01em;
}
.svc-card-price-note {
  font-size: 11px;
  color: #6b6b6b;
  line-height: 1.45;
  margin: 8px 0 0 0;
}

/* Prevent grid children from forcing horizontal page scroll on mobile —
   min-width:0 lets the flex/grid child shrink below its intrinsic content
   width, so the table (min-width:560px) can be contained by its wrapper
   rather than pushing the section wider than the viewport. */
.td-right { min-width: 0; }

/* =========================================================
   Ongoing Operations section — stacked layout
   Header block sits above a full-width comparison table,

   ========================================================= */
.ops-detail .ops-head {

}

}

  margin: 0 0 8px 0;
}

  margin: 28px 0 0 0;
  max-width: 720px;
}

/* Ensure clear visual space between "£1,500" and the "fixed price" phrase
   in the Finance Function Build price row, independent of flex gap. */
.td-period-phrase { margin-left: 4px; }

   and asymmetric .why-grid so the heading, body copy and partner list

.wwd-advisory .section-head {

}

  grid-template-columns: 1fr 1fr;
}

@media (max-width: 640px) {
  .svc-table-wrap { display: none; }
  .svc-tier-cards {
    display: flex;
    flex-direction: column;
    gap: 16px;
  }
  .ops-detail .ops-head { margin-bottom: 28px; }
}

  <script type="text/babel">
/* App shell — router */

function startCounter(el) {
  if (el.dataset.counterDone) return;
  el.dataset.counterDone = '1';
  const target = parseFloat(el.dataset.counterTarget);
  const format = el.dataset.counterFormat || 'integer';
  const duration = parseInt(el.dataset.counterDuration || '800', 10);
  const start = performance.now();
  const ease = (t) => 1 - Math.pow(1 - t, 3);
  const fmt = (n) => {
    if (format === 'decimal') return n.toFixed(1);
    if (format === 'comma') return Math.round(n).toLocaleString('en-GB');
    return Math.round(n).toString();
  };
  function tick(now) {
    const t = Math.min((now - start) / duration, 1);
    el.textContent = fmt(target * ease(t));
    if (t < 1) requestAnimationFrame(tick);
  }
  requestAnimationFrame(tick);
}
window.startCounter = startCounter;

function App() {
  const [path, setPath] = React.useState(() => {
    const h = window.location.hash.replace(/^#/, '');
    return h && h.startsWith('/') ? h : '/';
  });
  React.useEffect(() => {
    window.navigate = (to) => {
      window.location.hash = to;
      setPath(to);
      window.scrollTo({ top: 0, behavior: 'instant' });
    };
    const onHash = () => {
      const h = window.location.hash.replace(/^#/, '');
      setPath(h && h.startsWith('/') ? h : '/');
    };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  // Animation orchestration — runs after each route mount
  React.useEffect(() => {
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduceMotion) {
      document.querySelectorAll('[data-counter-target]:not([data-counter-done])').forEach(el => {
        const t = parseFloat(el.dataset.counterTarget);
        const f = el.dataset.counterFormat || 'integer';
        el.textContent = f === 'decimal' ? t.toFixed(1) : f === 'comma' ? Math.round(t).toLocaleString('en-GB') : Math.round(t).toString();
        el.dataset.counterDone = '1';
      });
      return;
    }

    // Stagger index on grid children (idempotent)
    document.querySelectorAll('.wwd-grid, .who-grid, .tiers-grid, .test-grid, .values-grid, .how-list, .every-grid, .vs-table').forEach(g => {
      if (g.dataset.staggered) return;
      g.dataset.staggered = '1';
      const kids = (g.classList.contains('vs-table'))
        ? g.querySelectorAll(':scope > .vs-row:not(.vs-row-head)')
        : g.children;
      [...kids].forEach((c, i) => c.style.setProperty('--stagger-i', i));
    });

    // Singleton observer — adds .in once, then unobserves so it never re-fires
    if (!window.__inclineIO) {
      window.__inclineIO = new IntersectionObserver((entries) => {
        entries.forEach(entry => {
          if (entry.isIntersecting) {
            entry.target.classList.add('in');
            window.__inclineIO.unobserve(entry.target);
            if (entry.target.matches('[data-counter-target]')) {
              startCounter(entry.target);
            }
          }
        });
      }, { rootMargin: '0px 0px -8% 0px', threshold: 0.05 });
    }
    document.querySelectorAll('main section:not(.hero-big):not(.in), .wwd-grid:not(.in), .who-grid:not(.in), .tiers-grid:not(.in), .test-grid:not(.in), .values-grid:not(.in), .how-list:not(.in), .every-grid:not(.in), .vs-table:not(.in)').forEach(el => {
      window.__inclineIO.observe(el);
    });

    // Hero mock dashboard slide-in + sequential figure counters (home-page only)
    const mocks = document.querySelector('.hb-mocks');
    if (mocks && !mocks.dataset.animated) {
      mocks.dataset.animated = '1';
      requestAnimationFrame(() => {
        mocks.classList.add('in');
        setTimeout(() => {
          const figures = mocks.querySelectorAll('[data-counter-target]');
          figures.forEach((f, i) => setTimeout(() => startCounter(f), i * 150));
        }, 600);
      });
    }
  }, [path]);

  let pageEl;
  if (path === '/about') pageEl = <AboutPage />;
  else if (path === '/what-we-do') pageEl = <WhatWeDoPage />;
  else if (path === '/construction-finance') pageEl = <ConstructionFinancePage />;
  else if (path === '/contact') pageEl = <ContactPage />;
  else pageEl = <HomePage />;

  const skipFooter = false;

  return (
    <div className="anim" data-screen-label={"Page: " + path}>
      <TopBar />
      <div className="page-shell">
        <Nav current={path} />
        <main>
          {pageEl}
        </main>
        {!skipFooter && <Footer />}
      </div>
      <MobileStickyBar />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);

  </script>
